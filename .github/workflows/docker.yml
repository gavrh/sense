name: Docker

on:
  push:
    branches:
      - master
  pull_request:
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker:
    name: Build and smoke test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: sense:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate compose config
        run: SEARXNG_SECRET_KEY=ci docker compose config -q

      - name: Smoke test
        run: |
          docker run -d --name sense-smoke -p 2727:2727 sense:ci

          for attempt in $(seq 1 30); do
            if curl -sf http://localhost:2727/ >/dev/null; then
              echo "sense responded after ${attempt}s"
              exit 0
            fi
            sleep 1
          done

          echo "sense did not respond within 30s"
          docker logs sense-smoke
          exit 1

      - name: Stop smoke test container
        if: always()
        run: docker rm -f sense-smoke || true
