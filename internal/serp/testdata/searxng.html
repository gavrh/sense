<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>query - searx</title>
</head>
<body>
  <main id="results">
    <article class="result result-default category-general">
      <h3><a href="https://example.com/first" class="url_header">First Result</a></h3>
      <p class="content">The first snippet.</p>
      <div class="engines"><span>google</span></div>
    </article>

    <article class="result result-default category-general">
      <h3><a href="/relative/page" class="url_header">Relative Result</a></h3>
      <p class="content">The relative snippet.</p>
    </article>

    <article class="result result-default category-general">
      <h3><a href="https://example.com/first#section" class="url_header">First Result Mirror</a></h3>
      <p class="content">A duplicate snippet.</p>
    </article>

    <article class="result result-default category-general">
      <h3><a href="https://third.example.org/page" class="url_header">Third Result</a></h3>
      <p class="content">The third snippet.</p>
    </article>

    <article class="result result-default category-general">
      <h3><a href="https://empty.example.com/page" class="url_header">   </a></h3>
      <p class="content">No title here.</p>
    </article>

    <article class="result result-default category-general">
      <h3><a href="mailto:someone@example.com" class="url_header">Email Result</a></h3>
      <p class="content">A mail link.</p>
    </article>

    <article class="result result-default category-general">
      <h3><a href="https://fourth.example.org/page" class="url_header">Fourth Result</a></h3>
      <p class="content">The fourth snippet.</p>
    </article>
  </main>
</body>
</html>
